id = "herdr-theme-picker"
name = "Theme Picker"
version = "0.8.2"
min_herdr_version = "0.8.0"
description = "Pick any terminalcolors.com theme and apply it to Herdr's UI via [theme.custom]."
platforms = ["linux", "macos", "windows"]

# Linux/macOS run the Bash implementation in bin/; Windows runs the Go port in
# go/, built on install. Actions run "./herdr-theme-picker", which is the Bash
# dispatcher at the repo root on Linux/macOS and resolves to
# herdr-theme-picker.exe on Windows, so `herdr-theme-picker.open` works on
# every platform. Panes are spawned without that .exe lookup and pane ids must
# be unique, so Windows gets its own picker-windows pane.

[[build]]
platforms = ["windows"]
command = ["go", "build", "-C", "go", "-trimpath", "-ldflags=-s -w", "-o", "../herdr-theme-picker.exe", "./cmd/herdr-theme-picker"]

[[panes]]
id = "picker"
title = "Theme Picker"
platforms = ["linux", "macos"]
placement = "popup"
width = "80%"
height = "70%"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\""]

[[panes]]
id = "picker-windows"
title = "Theme Picker"
platforms = ["windows"]
placement = "popup"
width = "80%"
height = "70%"
command = ["./herdr-theme-picker.exe", "picker"]

[[actions]]
id = "open"
title = "Theme picker: open"
contexts = ["workspace"]
command = ["./herdr-theme-picker", "open"]

[[actions]]
id = "sync"
title = "Theme picker: sync terminal colors"
contexts = ["global"]
platforms = ["windows"]
command = ["./herdr-theme-picker", "sync"]

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "pick a color theme"
